
name: watch

on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:

permissions:
  contents: write

concurrency: watch

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install gallery-dl requests

      - run: echo "$COOKIES" > cookies.txt
        env:
          COOKIES: ${{ secrets.TW_COOKIES }}

      - run: |
          touch archive.txt
          gallery-dl --cookies cookies.txt --download-archive archive.txt \
            --range 1-40 -o text-tweets=true -d media \
            --exec "python send.py {}" "https://x.com/thiansote/timeline" || true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - run: |
          git config user.name bot
          git config user.email bot@x
          git add archive.txt
          git commit -m "archive" || true
          git push || true
